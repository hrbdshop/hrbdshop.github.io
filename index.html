
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR BD SHOP</title>
<style>
body{margin:0;font-family:Arial;background:#fff;color:#164b32}
header{background:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.logo{font-size:23px;font-weight:bold;color:#08723e}
.banner{background:#eff8ed;text-align:center;padding:35px 12px}
.banner h1{font-size:27px}
.search{padding:15px}
.search input{width:90%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px}
.categories{display:flex;gap:10px;padding:10px;overflow:auto}
.categories span{padding:12px 18px;border:1px solid #ddd;border-radius:30px;white-space:nowrap}
h2{padding:10px 15px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{border:1px solid #ddd;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:140px;object-fit:cover}
.card button{background:#08723e;color:white;border:0;padding:10px;border-radius:8px}
footer{background:#075b35;color:white;text-align:center;padding:25px}
</style>
</head>

</div>
<div class="search"><input placeholder="🔍 পণ্যের নাম লিখে খুঁজুন"></div>
<div class="categories">

</div>
<h2>⭐ আমাদের জনপ্রিয় পণ্য</h2>

</div>
<footer><h3>HR BD SHOP</h3><p>আপনার বিশ্বস্ত অনলাইন শপ ❤️</p></footer>

</html>
